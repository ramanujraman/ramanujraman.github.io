project:
     type: website
     output-dir: docs

website:
     title: "Ramanuj Raman"
     description: "Academic portfolio, research notes, and photography by Ramanuj Raman."
     site-url: "https://ramanujraman.github.io"
     navbar:
          left:
               - text: Notes
                 href: notes.qmd
               - text: Some Ideas
                 href: blogs.qmd
               - text: Photos
                 href: photos.qmd

format:
     html:
          # --- 1. Core Theming ---
          theme:
               light: flatly
               dark: darkly
          respect-user-color-scheme: true
          css: styles.css

          # --- 2. Navigation & Table of Contents ---
          toc: true
          toc-title: "On this page"
          toc-location: right
          toc-depth: 3
          toc-expand: true
          smooth-scroll: true
          anchor-sections: true

          # --- 3. Reading Experience & Layout ---
          number-sections: false
          page-layout: article
          # --- Layout Grid Control ---
          grid:
               body-width: 1400px   
               margin-width: 150px  
          lightbox: true
          fig-cap-location: bottom

          # --- 4. Code Blocks & Math ---
          html-math-method: mathjax
          include-in-header: 
            - text: |
                <meta name="google-site-verification" content="Asp6ju1mO1Wt5GAC8tnYU3vLUc34ouwCYJaeog2Th-E" />
            - text: |
                <script>
                window.MathJax = {
                  loader: {load: ['[tex]/physics']},
                  tex: {
                    packages: {'[+]': ['physics']},
                    tags: 'ams'
                  }
                };
                </script>